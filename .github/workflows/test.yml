name: Test

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - 'test/*'

  workflow_dispatch:

env:
  CI: 'true'
  FORCE_COLOR: 'true'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: '10'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm check

  links:
    name: Check Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: '10'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check links in markdown files
        run: pnpm links

  test:
    name: ${{ matrix.package }} (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Core packages - test on all platforms
        include:
          # puppeteer-extra
          - package: puppeteer-extra
            node: 20
            os: ubuntu-latest
          - package: puppeteer-extra
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra
            node: 24
            os: ubuntu-latest
          - package: puppeteer-extra
            node: 22
            os: macos-latest
          - package: puppeteer-extra
            node: 22
            os: windows-latest

          # playwright-extra
          - package: playwright-extra
            node: 20
            os: ubuntu-latest
          - package: playwright-extra
            node: 22
            os: ubuntu-latest
          - package: playwright-extra
            node: 24
            os: ubuntu-latest
          - package: playwright-extra
            node: 22
            os: macos-latest
          - package: playwright-extra
            node: 22
            os: windows-latest

          # puppeteer-extra-plugin (base class)
          - package: puppeteer-extra-plugin
            node: 22
            os: ubuntu-latest

          # stealth plugin - important, test on all platforms
          - package: puppeteer-extra-plugin-stealth
            node: 20
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-stealth
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-stealth
            node: 24
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-stealth
            node: 22
            os: macos-latest
          - package: puppeteer-extra-plugin-stealth
            node: 22
            os: windows-latest

          # proxy-router
          - package: plugin-proxy-router
            node: 22
            os: ubuntu-latest
          - package: plugin-proxy-router
            node: 22
            os: macos-latest
          - package: plugin-proxy-router
            node: 22
            os: windows-latest

          # Other plugins - test on ubuntu only
          - package: puppeteer-extra-plugin-adblocker
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-anonymize-ua
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-block-resources
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-click-and-wait
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-devtools
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-flash
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-font-size
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-recaptcha
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-repl
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-user-data-dir
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-user-preferences
            node: 22
            os: ubuntu-latest
          - package: extract-stealth-evasions
            node: 22
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: '10'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck ${{ matrix.package }}
        run: pnpm --filter @zorilla/${{ matrix.package }} run --if-present typecheck

      - name: Install Playwright browsers
        if: matrix.package == 'playwright-extra'
        run: cd packages/playwright-extra && pnpm exec playwright install chromium chromium-headless-shell firefox webkit --with-deps

      - name: Install Chrome for Puppeteer
        if: contains(matrix.package, 'puppeteer') || matrix.package == 'plugin-proxy-router'
        run: cd packages/${{ matrix.package }} && pnpm exec puppeteer browsers install chrome

      - name: Run tests for ${{ matrix.package }}
        run: pnpm --filter @zorilla/${{ matrix.package }} test
