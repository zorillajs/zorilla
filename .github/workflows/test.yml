name: Test

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - 'test/*'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FORCE_COLOR: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
  PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm check

  links:
    name: Check Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check links in markdown files
        run: pnpm links

  puppeteer-type-contract:
    name: Puppeteer type contract (${{ matrix.puppeteer }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        puppeteer:
          - '22'
          - 'latest'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build packed package graph
        run: pnpm --filter "{./packages/puppeteer-extra-plugin-stealth}..." run build

      - name: Test packed packages against Puppeteer ${{ matrix.puppeteer }}
        run: pnpm test:pnpm-consumer
        env:
          PUPPETEER_VERSION: ${{ matrix.puppeteer }}

  test:
    name: ${{ matrix.package }} (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Core packages - test on all platforms
        include:
          # puppeteer-extra
          - package: puppeteer-extra
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra
            node: 24
            os: ubuntu-latest
          - package: puppeteer-extra
            node: 26
            os: ubuntu-latest
          - package: puppeteer-extra
            node: 22
            os: macos-latest
          - package: puppeteer-extra
            node: 22
            os: windows-latest

          # playwright-extra
          - package: playwright-extra
            node: 22
            os: ubuntu-latest
          - package: playwright-extra
            node: 22
            os: macos-latest
          - package: playwright-extra
            node: 22
            os: windows-latest

          # puppeteer-extra-plugin (base class)
          - package: puppeteer-extra-plugin
            node: 22
            os: ubuntu-latest

          # stealth plugin - important, test on all platforms
          - package: puppeteer-extra-plugin-stealth
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-stealth
            node: 24
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-stealth
            node: 26
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-stealth
            node: 22
            os: macos-latest
          - package: puppeteer-extra-plugin-stealth
            node: 22
            os: windows-latest

          # proxy-router
          - package: plugin-proxy-router
            node: 22
            os: ubuntu-latest
          - package: plugin-proxy-router
            node: 22
            os: macos-latest
          - package: plugin-proxy-router
            node: 22
            os: windows-latest

          # Other plugins - test on ubuntu only
          - package: puppeteer-extra-plugin-adblocker
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-anonymize-ua
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-block-resources
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-click-and-wait
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-devtools
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-flash
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-font-size
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-recaptcha
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-repl
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-user-data-dir
            node: 22
            os: ubuntu-latest
          - package: puppeteer-extra-plugin-user-preferences
            node: 22
            os: ubuntu-latest
          - package: extract-stealth-evasions
            node: 22
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build package graph
        run: pnpm --filter "{./packages/${{ matrix.package }}}..." run build

      - name: Build puppeteer-extra test plugin graph
        if: matrix.package == 'puppeteer-extra'
        run: pnpm --filter "{./packages/puppeteer-extra-plugin-stealth}..." run build

      - name: Typecheck ${{ matrix.package }}
        run: pnpm --filter "{./packages/${{ matrix.package }}}" run --if-present typecheck

      - name: Install Playwright browsers
        if: matrix.package == 'playwright-extra'
        shell: bash
        timeout-minutes: 10
        run: |
          cd packages/playwright-extra
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm exec playwright install chromium chromium-headless-shell firefox
          else
            pnpm exec playwright install chromium chromium-headless-shell firefox webkit
          fi

      - name: Use system Chrome for Puppeteer
        if: (contains(matrix.package, 'puppeteer') || matrix.package == 'plugin-proxy-router') && matrix.os == 'ubuntu-latest' && matrix.node != 22
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_path" ]; then
            echo "Unable to find system Chrome on the runner"
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Install Chrome for Puppeteer
        if: (contains(matrix.package, 'puppeteer') || matrix.package == 'plugin-proxy-router') && (matrix.os != 'ubuntu-latest' || matrix.node == 22)
        timeout-minutes: 5
        run: pnpm --dir packages/${{ matrix.package }} exec node ../../scripts/install-puppeteer-browser.mjs

      - name: Run Playwright tests
        if: matrix.package == 'playwright-extra'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --dir packages/playwright-extra exec playwright test --config test/playwright.config.ts --project=chromium --project=firefox
          else
            pnpm --dir packages/playwright-extra exec playwright test --config test/playwright.config.ts
          fi

      - name: Run tests for ${{ matrix.package }}
        if: matrix.package != 'playwright-extra'
        run: pnpm --filter "{./packages/${{ matrix.package }}}" test

      - name: Test packed packages in an isolated pnpm consumer
        if: matrix.package == 'puppeteer-extra' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test:pnpm-consumer
